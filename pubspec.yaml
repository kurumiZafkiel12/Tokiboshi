name: tokiboshi
description: "Tokiboshi — a sing-box client. Flutter UI, Rust middle layer, sing-box core."
publish_to: "none"
version: 0.2.1+4

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  rust_lib_tokiboshi:
    path: rust_builder
  flutter_rust_bridge: 2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
