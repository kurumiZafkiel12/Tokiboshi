name: tokiboshi
description: "Tokiboshi — a sing-box client. Flutter UI, Rust middle layer, sing-box core."
publish_to: "none"
homepage: https://github.com/kurumiZafkiel12/Tokiboshi
repository: https://github.com/kurumiZafkiel12/Tokiboshi
issue_tracker: https://github.com/kurumiZafkiel12/Tokiboshi/issues
version: 0.1.3+18

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  rust_lib_tokiboshi:
    path: rust_builder
  flutter_rust_bridge: 2.11.1
  webview_windows: ^0.4.0
  tray_manager: ^0.5.2
  window_manager: ^0.5.1
  file_selector: ^1.0.4
  image: ^4.5.4
  zxing2: ^0.2.4

  # Shared UI foundation for subsequent Windows and Android work.
  shadcn_flutter: ^0.0.55
  fl_chart: ^1.3.1
  lucide_icons_flutter: ^4.0.3
  flutter_animate: ^4.5.2
  # 2.x uses the same Flutter Material types as the existing pages.
  data_table_2: ^2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/rule-resources.json
    - assets/icon.png
    - assets/icon.ico
    - assets/flags/
    - assets/licenses/
