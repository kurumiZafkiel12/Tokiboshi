name: tokiboshi
description: "Tokiboshi — a sing-box client. Flutter UI, Rust middle layer, sing-box core."
publish_to: "none"
version: 0.5.0+9

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  rust_lib_tokiboshi:
    path: rust_builder
  flutter_rust_bridge: 2.11.1
  webview_windows: ^0.4.0
  tray_manager: ^0.5.2
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/icon.ico
