name: Publish verified v0.5.2
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify build and download artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh run view 43672763342 --json conclusion,headSha > "$RUNNER_TEMP/build.json"
          jq -e '.conclusion == "success" and .headSha == "024e7146dd14db58ce926c7e17abd9e668b02660"' "$RUNNER_TEMP/build.json"
          gh run download 43672763342 --name Tokiboshi-windows --dir "$RUNNER_TEMP/assets"
          cd "$RUNNER_TEMP/assets"
          echo '639657d3738621d4e99bf8bb81b9b51ef7669e57082491a40b309761b5537f08  Tokiboshi-Setup-0.5.2.exe' > SHA256SUMS.txt
          echo 'e299123b3eba07c3a58582fb3e371c843c9e9f4b3edf7dfabc4cb9c64b32f039  Tokiboshi-windows.zip' >> SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Publish installer and portable package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create v0.5.2 "$RUNNER_TEMP/assets/Tokiboshi-Setup-0.5.2.exe" "$RUNNER_TEMP/assets/Tokiboshi-windows.zip" "$RUNNER_TEMP/assets/SHA256SUMS.txt" --target 024e7146dd14db58ce926c7e17abd9e668b02660 --title 'Tokiboshi v0.5.2' --notes-file .github/release-notes/v0.5.2.md --latest
