name: Windows rule resource transport verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Download pinned core and exercise all 17 effective HTTPS sources
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $repo = 'repos/SagerNet/sing-box/releases/tags/v1.14.4'
          $asset = gh api $repo --jq '.assets[] | select(.name=="sing-box-1.14.4-windows-amd64.zip")' | ConvertFrom-Json
          if (-not $asset.digest) { throw 'Missing pinned core digest' }
          $zip = Join-Path $env:RUNNER_TEMP 'core.zip'
          Invoke-WebRequest $asset.browser_download_url -OutFile $zip
          $actual = 'sha256:' + (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $asset.digest) { throw 'Pinned core digest mismatch' }
          Expand-Archive $zip (Join-Path $env:RUNNER_TEMP 'core')
          $env:SING_BOX = (Get-ChildItem (Join-Path $env:RUNNER_TEMP 'core') -Filter sing-box.exe -Recurse | Select-Object -First 1).FullName
          $env:RULE_AUDIT_DIR = Join-Path $env:RUNNER_TEMP 'rule-probe'
          cargo run --locked --manifest-path rust/Cargo.toml --example rule_resource_probe 2>&1 | Tee-Object resource-transport.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Tokiboshi-rule-resource-transport
          path: resource-transport.log
