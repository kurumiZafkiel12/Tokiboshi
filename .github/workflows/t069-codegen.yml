name: T069 codegen and Windows verification (no publish)
on:
  push:
    branches: ['audit/t069-codegen-codex']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/flutter_rust_bridge_codegen.exe
            ~/.cargo/bin/cargo-expand.exe
          key: windows-frb-codegen-2.11.1-v2
      - name: Pinned tools and frozen Dart dependencies
        shell: pwsh
        run: |
          flutter pub get --enforce-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Frozen pub get failed' }
          if (-not (Get-Command flutter_rust_bridge_codegen -ErrorAction SilentlyContinue)) {
            cargo install flutter_rust_bridge_codegen --version 2.11.1 --locked
            if ($LASTEXITCODE -ne 0) { throw 'Pinned codegen install failed' }
          }
          $version = flutter_rust_bridge_codegen --version
          Write-Output $version
          if ($version -notmatch '2\.11\.1') { throw 'Wrong codegen version' }
          $flutterBin = Split-Path (Get-Command flutter).Source -Parent
          $dartBin = Join-Path $flutterBin 'cache/dart-sdk/bin/dart.exe'
          "DART_BIN=$dartBin" >> $env:GITHUB_ENV
          "T069_OUT=$env:RUNNER_TEMP/t069-semantic" >> $env:GITHUB_ENV
          if ($LASTEXITCODE -ne 0) { throw 'Codegen version failed' }
      - name: Regenerate and record generated difference
        shell: pwsh
        run: |
          flutter_rust_bridge_codegen generate 2>&1 | Tee-Object codegen.log
          if ($LASTEXITCODE -ne 0) { throw 'Codegen failed' }
          git diff --stat -- lib/src/rust rust/src/frb_generated.rs > generated-stat.txt
          git diff -- lib/src/rust rust/src/frb_generated.rs > generated.patch
          if (Test-Path tool/t069_codegen/require-clean) {
            git diff --exit-code -- lib/src/rust rust/src/frb_generated.rs
            if ($LASTEXITCODE -ne 0) { throw 'Committed bindings differ from regeneration' }
          }
          git diff --exit-code -- pubspec.lock rust/Cargo.lock
          if ($LASTEXITCODE -ne 0) { throw 'Frozen lock changed' }
      - uses: actions/upload-artifact@v4
        with:
          name: t069-regenerated-bindings
          path: |
            lib/src/rust/
            rust/src/frb_generated.rs
            codegen.log
            generated.patch
      - name: Verified core and Rust tests
        shell: pwsh
        run: |
          $release=Invoke-RestMethod 'https://api.github.com/repos/SagerNet/sing-box/releases/tags/v1.14.4'
          $asset=$release.assets | Where-Object name -eq 'sing-box-1.14.4-windows-amd64.zip'
          Invoke-WebRequest $asset.browser_download_url -OutFile "$env:RUNNER_TEMP/core.zip"
          $digest='sha256:'+(Get-FileHash "$env:RUNNER_TEMP/core.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne $asset.digest) { throw 'Core digest mismatch' }
          Expand-Archive "$env:RUNNER_TEMP/core.zip" "$env:RUNNER_TEMP/core"
          $env:SING_BOX=(Get-ChildItem "$env:RUNNER_TEMP/core" -Filter sing-box.exe -Recurse | Select-Object -First 1).FullName
          "SING_BOX=$env:SING_BOX" >> $env:GITHUB_ENV
          cargo test --locked --manifest-path rust/Cargo.toml 2>&1 | Tee-Object cargo-test.log
          if ($LASTEXITCODE -ne 0) { throw 'Rust tests failed' }
      - name: Flutter analysis tests and Windows release build
        shell: pwsh
        run: |
          flutter analyze --no-fatal-infos 2>&1 | Tee-Object analyze.log
          if ($LASTEXITCODE -ne 0) { throw 'Analysis failed' }
          flutter test --no-pub 2>&1 | Tee-Object flutter-test.log
          if ($LASTEXITCODE -ne 0) { throw 'Flutter tests failed' }
          flutter build windows --release 2>&1 | Tee-Object windows-build.log
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
      - name: Actual DLL bridge and loopback Rule Global Direct routing
        shell: pwsh
        run: |
          $env:T069_DLL=(Get-ChildItem build/windows/x64/runner/Release -Filter rust_lib_tokiboshi.dll -Recurse | Select-Object -First 1).FullName
          if (-not $env:T069_DLL) { throw 'Built DLL missing' }
          python tool/t069_codegen/runtime_probe.py 2>&1 | Tee-Object runtime-probe.log
          if ($LASTEXITCODE -ne 0) { throw 'Actual bridge or routing failed' }
      - name: Original Rust profile semantic probes on Windows
        if: always()
        shell: pwsh
        run: |
          $env:SEMANTIC_OUT="$env:RUNNER_TEMP/t069-profile-cases"
          cargo run --locked --manifest-path tool/t069_semantics/Cargo.toml 2>&1 | Tee-Object profile-semantics.log
          if ($LASTEXITCODE -ne 0) { throw 'Semantic probe infrastructure failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t069-codegen-verification
          path: |
            lib/src/rust/
            rust/src/frb_generated.rs
            *.log
            generated-stat.txt
            generated.patch
            build/windows/x64/runner/Release/
            ${{ runner.temp }}/t069-semantic/
            ${{ runner.temp }}/t069-profile-cases/
