name: Publish verified v0.0.7
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify build and download artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh run view 43736226644 --json conclusion,headSha > "$RUNNER_TEMP/build.json"
          jq -e '.conclusion == "success" and .headSha == "259f9e345f921f23ba508a121798768af58229c1"' "$RUNNER_TEMP/build.json"
          gh run download 43736226644 --name Tokiboshi-windows --dir "$RUNNER_TEMP/assets"
          cd "$RUNNER_TEMP/assets"
          echo 'e9a3f7daab26951a9c11c2cca996d52a2e746be5466439422949d0255b035cdc  Tokiboshi-Setup-0.0.7.exe' > SHA256SUMS.txt
          echo '9d725931ffb4bef705b6c24a39db29b4f71748d05c533493219b122458a9a9f3  Tokiboshi-windows.zip' >> SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Publish installer and portable package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create v0.0.7 "$RUNNER_TEMP/assets/Tokiboshi-Setup-0.0.7.exe" "$RUNNER_TEMP/assets/Tokiboshi-windows.zip" "$RUNNER_TEMP/assets/SHA256SUMS.txt" --target 259f9e345f921f23ba508a121798768af58229c1 --title 'Tokiboshi v0.0.7' --notes-file .github/release-notes/v0.0.7.md --latest
