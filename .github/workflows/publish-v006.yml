name: Publish verified v0.0.6
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify build and download artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh run view 43729227762 --json conclusion,headSha > "$RUNNER_TEMP/build.json"
          jq -e '.conclusion == "success" and .headSha == "7c2969f0bd9e4fc1fe9046a9d7bcac4a97d27167"' "$RUNNER_TEMP/build.json"
          gh run download 43729227762 --name Tokiboshi-windows --dir "$RUNNER_TEMP/assets"
          cd "$RUNNER_TEMP/assets"
          echo '36125a9db1e1282c64a8a7b01f1502c8d72ecd5e71dddaa33f860f6fbd200302  Tokiboshi-Setup-0.0.6.exe' > SHA256SUMS.txt
          echo 'e5eac514ce33c420ccb3ae41fba7bcbc8d36fb5ae341dfb278a32d3520350896  Tokiboshi-windows.zip' >> SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Publish installer and portable package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create v0.0.6 "$RUNNER_TEMP/assets/Tokiboshi-Setup-0.0.6.exe" "$RUNNER_TEMP/assets/Tokiboshi-windows.zip" "$RUNNER_TEMP/assets/SHA256SUMS.txt" --target 7c2969f0bd9e4fc1fe9046a9d7bcac4a97d27167 --title 'Tokiboshi v0.0.6' --notes-file .github/release-notes/v0.0.6.md --latest
