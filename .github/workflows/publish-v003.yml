name: Publish verified v0.0.3
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify build and download artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh run view 43706863719 --json conclusion,headSha > "$RUNNER_TEMP/build.json"
          jq -e '.conclusion == "success" and .headSha == "f0d0543a2e7d67d178ede50e9e361609ea81910e"' "$RUNNER_TEMP/build.json"
          gh run download 43706863719 --name Tokiboshi-windows --dir "$RUNNER_TEMP/assets"
          cd "$RUNNER_TEMP/assets"
          echo 'dfc669ca9c54b3784655ef71ab8db9b5eb4f4f7a5ef1d365773affc15b2fe2e1  Tokiboshi-Setup-0.0.3.exe' > SHA256SUMS.txt
          echo '683cd19be91974f26c934d07cd9109ca9ab867d4ae259f594f8c52d87410ee3d  Tokiboshi-windows.zip' >> SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Publish installer and portable package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create v0.0.3 "$RUNNER_TEMP/assets/Tokiboshi-Setup-0.0.3.exe" "$RUNNER_TEMP/assets/Tokiboshi-windows.zip" "$RUNNER_TEMP/assets/SHA256SUMS.txt" --target f0d0543a2e7d67d178ede50e9e361609ea81910e --title 'Tokiboshi v0.0.3' --notes-file .github/release-notes/v0.0.3.md --latest
