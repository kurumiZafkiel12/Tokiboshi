name: Publish verified v0.0.4
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify build and download artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh run view 43711935497 --json conclusion,headSha > "$RUNNER_TEMP/build.json"
          jq -e '.conclusion == "success" and .headSha == "bbd96d72803e81cbe5b077056a459a6c1e9c22a5"' "$RUNNER_TEMP/build.json"
          gh run download 43711935497 --name Tokiboshi-windows --dir "$RUNNER_TEMP/assets"
          cd "$RUNNER_TEMP/assets"
          echo 'e0364704ab1a155010488d4fa02fa7c96ca78facd70582963d140d0da686dbcf  Tokiboshi-Setup-0.0.4.exe' > SHA256SUMS.txt
          echo 'a59ca984b254c3217444103a1d188bc4af3d7a4ca9920cf526239d7f8c4dd98d  Tokiboshi-windows.zip' >> SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Publish installer and portable package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create v0.0.4 "$RUNNER_TEMP/assets/Tokiboshi-Setup-0.0.4.exe" "$RUNNER_TEMP/assets/Tokiboshi-windows.zip" "$RUNNER_TEMP/assets/SHA256SUMS.txt" --target bbd96d72803e81cbe5b077056a459a6c1e9c22a5 --title 'Tokiboshi v0.0.4' --notes-file .github/release-notes/v0.0.4.md --latest
