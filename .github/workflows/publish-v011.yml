name: Publish verified v0.1.1 Windows
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: publish-v011
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TARGET: aaad18ed8d39537189a23483000286eeb0c4f8e6
      VERIFIED_SOURCE: fa63297e408934bf69d4b28d7f2efa5a43f0e4aa
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact candidate source and download pinned assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$RELEASE_TARGET^{tree}")" = "$(git rev-parse "$VERIFIED_SOURCE^{tree}")"
          gh run view 44857699553 --json conclusion,headSha,workflowName > "$RUNNER_TEMP/build.json"
          jq -e --arg sha "$VERIFIED_SOURCE" '.conclusion == "success" and .headSha == $sha and .workflowName == "windows"' "$RUNNER_TEMP/build.json"
          gh run download 44857699553 --name Tokiboshi-windows --dir "$RUNNER_TEMP/assets"
          cd "$RUNNER_TEMP/assets"
          cat > SHA256SUMS.txt <<'SUMS'
          4f670177e98068bb90939ad1dfa69b3e2c0760c0b0375e30d3a4e2dca10bbe6c  Tokiboshi-Setup-0.1.1.exe
          73af5a5952522d57115c51f0627c616b3e0539a7f7091e634855717aa29dad01  Tokiboshi-windows.zip
          SUMS
          sha256sum --check SHA256SUMS.txt
      - name: Stage release and verify uploaded bytes
        shell: bash
        run: |
          set -euo pipefail
          gh release create v0.1.1 "$RUNNER_TEMP/assets/Tokiboshi-Setup-0.1.1.exe" "$RUNNER_TEMP/assets/Tokiboshi-windows.zip" "$RUNNER_TEMP/assets/SHA256SUMS.txt" --target "$RELEASE_TARGET" --title 'Tokiboshi v0.1.1' --notes-file .github/release-notes/v0.1.1.md --draft
          gh release view v0.1.1 --json isDraft,assets > "$RUNNER_TEMP/staged.json"
          jq -e '.isDraft == true and (.assets | length) == 3' "$RUNNER_TEMP/staged.json"
          gh release download v0.1.1 --dir "$RUNNER_TEMP/roundtrip"
          cd "$RUNNER_TEMP/roundtrip"
          cmp SHA256SUMS.txt "$RUNNER_TEMP/assets/SHA256SUMS.txt"
          sha256sum --check SHA256SUMS.txt
      - name: Publish verified Windows release
        run: gh release edit v0.1.1 --draft=false --latest
      - name: Verify public download links, latest and tag
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/public-downloads" "$RUNNER_TEMP/publication-proof"
          cd "$RUNNER_TEMP/public-downloads"
          for name in Tokiboshi-Setup-0.1.1.exe Tokiboshi-windows.zip SHA256SUMS.txt; do
            curl --fail --location --retry 3 --retry-delay 3 --output "$name" "https://github.com/$GH_REPO/releases/download/v0.1.1/$name"
          done
          cmp SHA256SUMS.txt "$RUNNER_TEMP/assets/SHA256SUMS.txt"
          sha256sum --check SHA256SUMS.txt
          gh api "repos/$GH_REPO/releases/latest" > "$RUNNER_TEMP/publication-proof/release.json"
          jq -e '.tag_name == "v0.1.1" and .name == "Tokiboshi v0.1.1" and .draft == false and .prerelease == false and (.assets | length) == 3' "$RUNNER_TEMP/publication-proof/release.json"
          gh api "repos/$GH_REPO/git/ref/tags/v0.1.1" > "$RUNNER_TEMP/publication-proof/tag.json"
          jq -e --arg sha "$RELEASE_TARGET" '.object.type == "commit" and .object.sha == $sha' "$RUNNER_TEMP/publication-proof/tag.json"
          cp SHA256SUMS.txt "$RUNNER_TEMP/publication-proof/SHA256SUMS.txt"
          cp "$RUNNER_TEMP/build.json" "$RUNNER_TEMP/publication-proof/build.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Tokiboshi-v011-publication-proof
          path: ${{ runner.temp }}/publication-proof
