name: Publish verified v0.0.5
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify build and download artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh run view 43717596383 --json conclusion,headSha > "$RUNNER_TEMP/build.json"
          jq -e '.conclusion == "success" and .headSha == "a2bbaf34eb4dab54c272bda02a46d2c15f4bdb28"' "$RUNNER_TEMP/build.json"
          gh run download 43717596383 --name Tokiboshi-windows --dir "$RUNNER_TEMP/assets"
          cd "$RUNNER_TEMP/assets"
          echo '4a426f8b3ffc00daf62bb2cd718f77e1e8d6b566a3b17c7d43bbc25d70f38452  Tokiboshi-Setup-0.0.5.exe' > SHA256SUMS.txt
          echo '69fea32a5e0b11c314a79e71ab4ce9ed670220c0ba5e902279f57044a5890804  Tokiboshi-windows.zip' >> SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Publish installer and portable package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create v0.0.5 "$RUNNER_TEMP/assets/Tokiboshi-Setup-0.0.5.exe" "$RUNNER_TEMP/assets/Tokiboshi-windows.zip" "$RUNNER_TEMP/assets/SHA256SUMS.txt" --target a2bbaf34eb4dab54c272bda02a46d2c15f4bdb28 --title 'Tokiboshi v0.0.5' --notes-file .github/release-notes/v0.0.5.md --latest
