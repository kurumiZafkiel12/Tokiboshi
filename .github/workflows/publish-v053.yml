name: Publish verified v0.5.3
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify build and download artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh run view 43675419125 --json conclusion,headSha > "$RUNNER_TEMP/build.json"
          jq -e '.conclusion == "success" and .headSha == "5388f0f547dd712386795c22e81da7790715b95d"' "$RUNNER_TEMP/build.json"
          gh run download 43675419125 --name Tokiboshi-windows --dir "$RUNNER_TEMP/assets"
          cd "$RUNNER_TEMP/assets"
          echo 'a54e553897f35e1b860bf6c50a8fc254dd1fd5f70f96f3f6141f3d7f0230c725  Tokiboshi-Setup-0.5.3.exe' > SHA256SUMS.txt
          echo 'd469c143de5356ced869cd6efff8818b38bd990aa9b3b8fe51272d40e396fd40  Tokiboshi-windows.zip' >> SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Publish installer and portable package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create v0.5.3 "$RUNNER_TEMP/assets/Tokiboshi-Setup-0.5.3.exe" "$RUNNER_TEMP/assets/Tokiboshi-windows.zip" "$RUNNER_TEMP/assets/SHA256SUMS.txt" --target 5388f0f547dd712386795c22e81da7790715b95d --title 'Tokiboshi v0.5.3' --notes-file .github/release-notes/v0.5.3.md --latest
