name: windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Rust middle layer tests
        run: cargo test --manifest-path rust/Cargo.toml

      - name: Flutter tests
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release

      - name: Bundle sing-box core
        shell: pwsh
        run: |
          $ver = "1.11.15"
          Invoke-WebRequest -Uri "https://github.com/SagerNet/sing-box/releases/download/v$ver/sing-box-$ver-windows-amd64.zip" -OutFile sb.zip
          Expand-Archive sb.zip -DestinationPath sb
          Copy-Item "sb/sing-box-$ver-windows-amd64/sing-box.exe" "build/windows/x64/runner/Release/sing-box.exe"

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "Tokiboshi-windows.zip"

      - name: Build installer
        shell: pwsh
        run: |
          $ver = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)').Matches[0].Groups[1].Value
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$ver" installer\tokiboshi.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - uses: actions/upload-artifact@v4
        with:
          name: Tokiboshi-windows
          path: |
            Tokiboshi-windows.zip
            Tokiboshi-Setup-*.exe
