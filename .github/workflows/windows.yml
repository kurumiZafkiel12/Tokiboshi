name: windows

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Fetch verified sing-box for native tests and packaging
        shell: pwsh
        run: |
          $release = Invoke-RestMethod 'https://api.github.com/repos/SagerNet/sing-box/releases/tags/v1.14.4'
          $asset = $release.assets | Where-Object name -eq 'sing-box-1.14.4-windows-amd64.zip'
          if (-not $asset -or -not $asset.digest.StartsWith('sha256:')) { throw 'Missing official core asset digest' }
          $archive = Join-Path $env:RUNNER_TEMP 'sing-box.zip'
          Invoke-WebRequest $asset.browser_download_url -OutFile $archive
          $actual = 'sha256:' + (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $asset.digest) { throw 'Core checksum mismatch' }
          $unpack = Join-Path $env:RUNNER_TEMP 'verified-core'
          Expand-Archive $archive $unpack
          $binary = Get-ChildItem $unpack -Filter sing-box.exe -Recurse | Select-Object -First 1
          if (-not $binary) { throw 'Core binary missing' }
          "SING_BOX=$($binary.FullName)" >> $env:GITHUB_ENV
          "SING_BOX_DIR=$($binary.DirectoryName)" >> $env:GITHUB_ENV
          & $binary.FullName version
          if ($LASTEXITCODE -ne 0) { throw 'Core version check failed' }

      - name: Rust middle layer tests
        run: |
          $log = Join-Path $env:RUNNER_TEMP "cargo-test.log"
          cargo test --manifest-path rust/Cargo.toml 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $details = (Get-Content $log -Tail 100) -join "`n"
            $details = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error::$details"
            exit $code
          }

      - name: Flutter dependencies
        run: |
          $log = Join-Path $env:RUNNER_TEMP "flutter-pub.log"
          flutter pub get --enforce-lockfile 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $details = (Get-Content $log -Tail 100) -join "`n"
            $details = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error::$details"
            exit $code
          }

      - name: Flutter analysis
        run: |
          $log = Join-Path $env:RUNNER_TEMP "flutter-analyze.log"
          # Flutter 3.50 marks the compatibility Material barrel as deprecated.
          # Keep infos visible; errors and warnings still fail this check.
          flutter analyze --no-fatal-infos 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $details = (Get-Content $log -Tail 100) -join "`n"
            $details = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error::$details"
            exit $code
          }

      - name: Flutter tests
        run: |
          $log = Join-Path $env:RUNNER_TEMP "flutter-test.log"
          flutter test --no-pub 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $details = (Get-Content $log -Tail 100) -join "`n"
            $details = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error::$details"
            exit $code
          }

      - name: Build Windows release
        run: |
          $log = Join-Path $env:RUNNER_TEMP "flutter-build.log"
          flutter build windows --release 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $details = (Get-Content $log -Tail 100) -join "`n"
            $details = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error::$details"
            exit $code
          }


      - name: Bundle verified core
        shell: pwsh
        run: |
          Copy-Item "$env:SING_BOX_DIR\*" 'build/windows/x64/runner/Release/' -Recurse -Force

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "Tokiboshi-windows.zip"

      - name: Build installer
        shell: pwsh
        run: |
          $ver = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)').Matches[0].Groups[1].Value
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$ver" installer\tokiboshi.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - uses: actions/upload-artifact@v4
        with:
          name: Tokiboshi-windows
          path: |
            Tokiboshi-windows.zip
            Tokiboshi-Setup-*.exe
