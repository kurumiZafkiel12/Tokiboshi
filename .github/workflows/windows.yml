name: windows

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Fetch verified sing-box for native tests and packaging
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $release = Invoke-RestMethod 'https://api.github.com/repos/SagerNet/sing-box/releases/tags/v1.14.4' -Headers $headers
          $asset = $release.assets | Where-Object name -eq 'sing-box-1.14.4-windows-amd64.zip'
          if (-not $asset -or -not $asset.digest.StartsWith('sha256:')) { throw 'Missing official core asset digest' }
          $archive = Join-Path $env:RUNNER_TEMP 'sing-box.zip'
          Invoke-WebRequest $asset.browser_download_url -OutFile $archive
          $actual = 'sha256:' + (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $asset.digest) { throw 'Core checksum mismatch' }
          $unpack = Join-Path $env:RUNNER_TEMP 'verified-core'
          Expand-Archive $archive $unpack
          $binary = Get-ChildItem $unpack -Filter sing-box.exe -Recurse | Select-Object -First 1
          if (-not $binary) { throw 'Core binary missing' }
          "SING_BOX=$($binary.FullName)" >> $env:GITHUB_ENV
          "SING_BOX_DIR=$($binary.DirectoryName)" >> $env:GITHUB_ENV
          & $binary.FullName version
          if ($LASTEXITCODE -ne 0) { throw 'Core version check failed' }

      - name: Rust middle layer tests
        run: |
          $log = Join-Path $env:RUNNER_TEMP "cargo-test.log"
          cargo test --locked --manifest-path rust/Cargo.toml 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $details = (Get-Content $log -Tail 100) -join "`n"
            $details = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error::$details"
            exit $code
          }

      - name: Flutter dependencies
        run: |
          $log = Join-Path $env:RUNNER_TEMP "flutter-pub.log"
          flutter pub get --enforce-lockfile 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $details = (Get-Content $log -Tail 100) -join "`n"
            $details = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error::$details"
            exit $code
          }

      - name: Verify per-application routing on the native core
        shell: pwsh
        run: |
          dart run tool/v013/windows_process_route.dart
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows process routing failed' }

      - name: Flutter analysis
        run: |
          $log = Join-Path $env:RUNNER_TEMP "flutter-analyze.log"
          # Flutter 3.50 marks the compatibility Material barrel as deprecated.
          # Keep infos visible; errors and warnings still fail this check.
          flutter analyze --no-fatal-infos 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $details = (Get-Content $log -Tail 100) -join "`n"
            $details = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error::$details"
            exit $code
          }

      - name: Prepare local TLS and native desktop checks
        shell: pwsh
        run: |
          $openssl = Get-ChildItem 'C:/Program Files/Git' -Filter openssl.exe -Recurse | Select-Object -First 1
          if (-not $openssl) { throw 'OpenSSL fixture generator missing' }
          $tls = Join-Path $env:RUNNER_TEMP 'tokiboshi-tls-fixture'
          New-Item $tls -ItemType Directory -Force | Out-Null
          & $openssl.FullName req -x509 -newkey rsa:2048 -nodes -keyout "$tls/key.pem" -out "$tls/cert.pem" -days 1 -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1'
          if ($LASTEXITCODE -ne 0) { throw 'TLS fixture generation failed' }
          "TOKIBOSHI_TLS_TEST_DIR=$tls" >> $env:GITHUB_ENV
          "TOKIBOSHI_NATIVE_CHECKS=1" >> $env:GITHUB_ENV
          "TOKIBOSHI_UI_CAPTURE=$env:RUNNER_TEMP/tokiboshi-release-audit/ui" >> $env:GITHUB_ENV
          "TOKIBOSHI_UI_FONT=C:/Windows/Fonts/msyh.ttc" >> $env:GITHUB_ENV

      - name: Flutter tests
        run: |
          $log = Join-Path $env:RUNNER_TEMP "flutter-test.log"
          flutter test --no-pub 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $details = (Get-Content $log -Tail 100) -join "`n"
            $details = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error::$details"
            exit $code
          }

      - name: Build Windows release
        run: |
          $log = Join-Path $env:RUNNER_TEMP "flutter-build.log"
          flutter build windows --release 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $details = (Get-Content $log -Tail 100) -join "`n"
            $details = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error::$details"
            exit $code
          }


      - name: Verify executable requires administrator
        shell: pwsh
        run: |
          $tools = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter mt.exe -Recurse |
            Where-Object { $_.Directory.Name -eq "x64" } | Select-Object -First 1
          if (-not $tools) { throw "Windows SDK manifest tool is missing" }
          $exe = (Resolve-Path 'build/windows/x64/runner/Release/tokiboshi.exe').Path
          $manifest = Join-Path $env:RUNNER_TEMP 'tokiboshi-execution.manifest'
          & $tools.FullName "-inputresource:$exe;#1" "-out:$manifest"
          if ($LASTEXITCODE -ne 0) { throw 'The executable manifest could not be extracted' }
          $xml = [xml] (Get-Content -LiteralPath $manifest -Raw)
          $level = $xml.SelectSingleNode("//*[local-name()='requestedExecutionLevel']")
          if (-not $level -or $level.GetAttribute('level') -ne 'requireAdministrator' -or
              $level.GetAttribute('uiAccess') -ne 'false') { throw "Tokiboshi elevation manifest is invalid" }

      - name: Verify actual built DLL and elevated parent wait
        shell: pwsh
        run: |
          $flutterBin = Split-Path (Get-Command flutter).Source -Parent
          $env:DART_BIN = Join-Path $flutterBin 'cache/dart-sdk/bin/dart.exe'
          $env:T069_OUT = Join-Path $env:RUNNER_TEMP 'tokiboshi-release-audit'
          $env:T069_DLL = (Get-ChildItem build/windows/x64/runner/Release -Filter rust_lib_tokiboshi.dll -Recurse | Select-Object -First 1).FullName
          python tool/release008/parent_wait_probe.py
          if ($LASTEXITCODE -ne 0) { throw 'Native handoff failed' }
          python tool/t069_codegen/runtime_probe.py
          if ($LASTEXITCODE -ne 0) { throw 'Built DLL or route verification failed' }
          & $env:DART_BIN run tool/reissue009/network_probe.dart
          if ($LASTEXITCODE -ne 0) { throw 'LAN or proxy/controller authentication verification failed' }

      - name: Bundle verified core
        shell: pwsh
        run: |
          Copy-Item "$env:SING_BOX_DIR\*" 'build/windows/x64/runner/Release/' -Recurse -Force

      - name: Verify the elevated Windows executable starts the core in standby
        shell: pwsh
        run: tool/v013/windows_standby.ps1 build/windows/x64/runner/Release

      - name: Record owned installation files
        shell: pwsh
        run: |
          $root = (Resolve-Path 'build/windows/x64/runner/Release').Path
          $files = @(Get-ChildItem $root -File -Recurse | ForEach-Object { $_.FullName.Substring($root.Length + 1).Replace('\','/') })
          ConvertTo-Json -InputObject @($files + 'installer-files.json') | Set-Content "$root/installer-files.json" -Encoding utf8

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "Tokiboshi-windows.zip"

      - name: Build installer
        shell: pwsh
        run: |
          $ver = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)').Matches[0].Groups[1].Value
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$ver" installer\tokiboshi.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Verify unattended upgrade from the published Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assets = Join-Path $env:RUNNER_TEMP 'tokiboshi-upgrade-previous'
          gh release download v0.1.2 --repo $env:GITHUB_REPOSITORY --pattern 'Tokiboshi-Setup-0.1.2.exe' --dir $assets
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the previous installer' }
          $setup = (Get-ChildItem -Filter 'Tokiboshi-Setup-*.exe' | Select-Object -First 1).FullName
          $payload = (Resolve-Path 'build/windows/x64/runner/Release').Path
          $proof = Join-Path $env:RUNNER_TEMP 'tokiboshi-release-audit/installer-upgrade'
          & installer/tests/upgrade-install.ps1 $setup (Join-Path $assets 'Tokiboshi-Setup-0.1.2.exe') $payload $proof

      - uses: actions/upload-artifact@v4
        with:
          name: Tokiboshi-windows
          path: |
            Tokiboshi-windows.zip
            Tokiboshi-Setup-*.exe

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Tokiboshi-release-audit
          path: |
            v007-widget-results.json
            ${{ runner.temp }}/tokiboshi-release-audit/
