name: windows

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Rust middle layer tests
        run: |
          $log = Join-Path $env:RUNNER_TEMP "cargo-test.log"
          cargo test --manifest-path rust/Cargo.toml 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Get-Content $log -Tail 30 | ForEach-Object {
              $line = $_.Replace('%', '%25')
              Write-Output "::error::$line"
            }
            exit $code
          }

      - name: Flutter dependencies
        run: |
          $log = Join-Path $env:RUNNER_TEMP "flutter-pub.log"
          flutter pub get --enforce-lockfile 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Get-Content $log -Tail 30 | ForEach-Object {
              $line = $_.Replace('%', '%25')
              Write-Output "::error::$line"
            }
            exit $code
          }

      - name: Flutter analysis
        run: |
          $log = Join-Path $env:RUNNER_TEMP "flutter-analyze.log"
          flutter analyze 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Get-Content $log -Tail 30 | ForEach-Object {
              $line = $_.Replace('%', '%25')
              Write-Output "::error::$line"
            }
            exit $code
          }

      - name: Flutter tests
        run: |
          $log = Join-Path $env:RUNNER_TEMP "flutter-test.log"
          flutter test --no-pub 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Get-Content $log -Tail 30 | ForEach-Object {
              $line = $_.Replace('%', '%25')
              Write-Output "::error::$line"
            }
            exit $code
          }

      - name: Build Windows release
        run: |
          $log = Join-Path $env:RUNNER_TEMP "flutter-build.log"
          flutter build windows --release 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Get-Content $log -Tail 30 | ForEach-Object {
              $line = $_.Replace('%', '%25')
              Write-Output "::error::$line"
            }
            exit $code
          }


      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "Tokiboshi-windows.zip"

      - name: Build installer
        shell: pwsh
        run: |
          $ver = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)').Matches[0].Groups[1].Value
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$ver" installer\tokiboshi.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - uses: actions/upload-artifact@v4
        with:
          name: Tokiboshi-windows
          path: |
            Tokiboshi-windows.zip
            Tokiboshi-Setup-*.exe
