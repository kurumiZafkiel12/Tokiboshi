name: Verify signed Android release installation
on:
  push:
    branches: ['release/publish-android-v009-codex']
    paths: ['.github/workflows/verify-android-release.yml']
permissions:
  actions: read
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact tested release APK
        run: |
          gh api "repos/$GH_REPO/actions/runs/44119946722" | jq -e '.conclusion == "success" and .head_sha == "9aa0c3bc60906130d9f52b7dfd9109bd91fef8c5"'
          gh run download 44119946722 --name Tokiboshi-Android --dir "$RUNNER_TEMP/packages"
          cd "$RUNNER_TEMP/packages"
          sha256sum --check SHA256SUMS-android.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch the actual signed AOT APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 2048
          script: bash tool/android/release_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-signed-release-smoke
          path: ${{ runner.temp }}/release-smoke/
