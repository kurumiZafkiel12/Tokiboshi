name: Publish verified v0.0.8
on:
  push:
    branches: ['release/publish-v008-codex']
    paths: ['.github/workflows/publish-v008.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Verify immutable build and test results
        run: |
          set -euo pipefail
          for run in 43861827073 43861817486; do
            gh run view "$run" --json conclusion,headSha > "$RUNNER_TEMP/run-$run.json"
            jq -e '.conclusion == "success" and .headSha == "3328be177979e9cf8c76acee790019429ac3c44b"' "$RUNNER_TEMP/run-$run.json"
          done
          gh api "repos/$GH_REPO/releases/446987174" > "$RUNNER_TEMP/release-before.json"
          jq -e '.draft == true and .tag_name == "v0.0.8" and .target_commitish == "3328be177979e9cf8c76acee790019429ac3c44b"' "$RUNNER_TEMP/release-before.json"
      - name: Download exact packages and verify SHA256
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/packages"
          gh run download 43861827073 --name Tokiboshi-windows --dir "$RUNNER_TEMP/packages"
          cd "$RUNNER_TEMP/packages"
          echo 'd036ab6a33143de5d022fdeeda5d1ccb99fa2a580d539b0d6f9039de83aa77de  Tokiboshi-Setup-0.0.8.exe' > SHA256SUMS.txt
          echo '3e76d02e6e947223098eb34bb42db6130540a4fc55e09275f688e9e7137db8d0  Tokiboshi-windows.zip' >> SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Upload without overwriting and verify server digests
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/packages"
          gh release upload v0.0.8 Tokiboshi-Setup-0.0.8.exe Tokiboshi-windows.zip SHA256SUMS.txt
          gh api "repos/$GH_REPO/releases/446987174" > "$RUNNER_TEMP/release-uploaded.json"
          python - <<'PY'
          import json,hashlib,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          r=json.loads((root/'release-uploaded.json').read_text())
          expected=['Tokiboshi-Setup-0.0.8.exe','Tokiboshi-windows.zip','SHA256SUMS.txt']
          assert sorted(a['name'] for a in r['assets'])==sorted(expected)
          for asset in r['assets']:
              p=root/'packages'/asset['name']
              assert asset['state']=='uploaded'
              assert asset['digest']=='sha256:'+hashlib.sha256(p.read_bytes()).hexdigest()
          print('All three uploaded assets match the verified build bytes.')
          PY
      - name: Publish the verified draft
        run: |
          set -euo pipefail
          gh release edit v0.0.8 --draft=false --latest
          gh api "repos/$GH_REPO/releases/446987174" > "$RUNNER_TEMP/release-published.json"
          jq -e '.draft == false and .prerelease == false and .tag_name == "v0.0.8" and (.assets | length) == 3' "$RUNNER_TEMP/release-published.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v008-publication-evidence
          path: |
            ${{ runner.temp }}/run-*.json
            ${{ runner.temp }}/release-*.json
            ${{ runner.temp }}/packages/SHA256SUMS.txt
