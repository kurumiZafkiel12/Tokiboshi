name: Publish verified v0.0.9-r2 revision 2
on:
  push:
    branches: ['release/publish-v009-r2-codex']
    paths: ['.github/workflows/publish-v009-r2.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Verify immutable build and test results
        run: |
          set -euo pipefail
          for run in 44064840879; do
            gh run view "$run" --json conclusion,headSha > "$RUNNER_TEMP/run-$run.json"
            jq -e '.conclusion == "success" and .headSha == "7ba5c5f537f28c3b3ef2e3599d2df49400e9960d"' "$RUNNER_TEMP/run-$run.json"
          done
          gh api "repos/$GH_REPO/git/ref/tags/v0.0.9-r2" | jq -e '.object.sha == "7ba5c5f537f28c3b3ef2e3599d2df49400e9960d"'
          gh api "repos/$GH_REPO/git/ref/heads/main" | jq -e '.object.sha == "a52e8f0c2660fa7fd4c2583dc3d9a1d856249192"'
          gh api "repos/$GH_REPO/commits/a52e8f0c2660fa7fd4c2583dc3d9a1d856249192" | jq -e '.commit.tree.sha == "8c164fdcd434dc062753b56d795b652edc90f64f"'
          gh api "repos/$GH_REPO/releases/448478259" > "$RUNNER_TEMP/release-before.json"
          jq -e '.draft == true and (.assets | length) == 0 and .tag_name == "v0.0.9-r2" and .target_commitish == "7ba5c5f537f28c3b3ef2e3599d2df49400e9960d"' "$RUNNER_TEMP/release-before.json"
      - name: Download exact packages and verify SHA256
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/packages"
          gh run download 44064840879 --name Tokiboshi-windows --dir "$RUNNER_TEMP/packages"
          cd "$RUNNER_TEMP/packages"
          echo '9ca9c1ca5eb6ca4c54095cfb76c0e87fcdadfb6f1a44260328f1af1841a5ffff  Tokiboshi-Setup-0.0.9-r2.exe' > SHA256SUMS.txt
          echo 'f4da03da88f05064af9239c933d07dcb25c14f3d5ea1ac04f4adbce71800d317  Tokiboshi-windows.zip' >> SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Upload without overwriting and verify server digests
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/packages"
          gh release upload v0.0.9-r2 Tokiboshi-Setup-0.0.9-r2.exe Tokiboshi-windows.zip SHA256SUMS.txt
          gh api "repos/$GH_REPO/releases/448478259" > "$RUNNER_TEMP/release-uploaded.json"
          python - <<'PY'
          import json,hashlib,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          r=json.loads((root/'release-uploaded.json').read_text())
          expected=['Tokiboshi-Setup-0.0.9-r2.exe','Tokiboshi-windows.zip','SHA256SUMS.txt']
          assert sorted(a['name'] for a in r['assets'])==sorted(expected)
          for asset in r['assets']:
              p=root/'packages'/asset['name']
              assert asset['state']=='uploaded'
              assert asset['digest']=='sha256:'+hashlib.sha256(p.read_bytes()).hexdigest()
          print('All three uploaded assets match the verified build bytes.')
          PY
      - name: Publish the verified draft
        run: |
          set -euo pipefail
          gh release edit v0.0.9-r2 --draft=false --latest
          gh api "repos/$GH_REPO/releases/448478259" > "$RUNNER_TEMP/release-published.json"
          jq -e '.draft == false and .prerelease == false and .tag_name == "v0.0.9-r2" and (.assets | length) == 3' "$RUNNER_TEMP/release-published.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v009-r2-publication-evidence
          path: |
            ${{ runner.temp }}/run-*.json
            ${{ runner.temp }}/release-*.json
            ${{ runner.temp }}/packages/SHA256SUMS.txt
