name: Publish verified v0.1.0 Windows
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: publish-v010
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TARGET: a605bc221a046b71ed56275393ab2821eb044ca8
      VERIFIED_SOURCE: e092fe0f2d9f3940fc99c46fa55593871d2c5b65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact candidate source and download pinned assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$RELEASE_TARGET^{tree}")" = "$(git rev-parse "$VERIFIED_SOURCE^{tree}")"
          gh run view 44197750024 --json conclusion,headSha,workflowName > "$RUNNER_TEMP/build.json"
          jq -e --arg sha "$VERIFIED_SOURCE" '.conclusion == "success" and .headSha == $sha and .workflowName == "windows"' "$RUNNER_TEMP/build.json"
          gh run download 44197750024 --name Tokiboshi-windows --dir "$RUNNER_TEMP/assets"
          cd "$RUNNER_TEMP/assets"
          cat > SHA256SUMS.txt <<'SUMS'
          048955b366cef1afe906908fe429b3ee1d594ff113c1e5d33737462374a2e587  Tokiboshi-Setup-0.1.0.exe
          8f0d288970bc74d5891fe2bbddbf132caf31de3eff199b374c06f95ee36bda65  Tokiboshi-windows.zip
          SUMS
          sha256sum --check SHA256SUMS.txt
      - name: Stage release and verify uploaded bytes
        shell: bash
        run: |
          set -euo pipefail
          gh release create v0.1.0 "$RUNNER_TEMP/assets/Tokiboshi-Setup-0.1.0.exe" "$RUNNER_TEMP/assets/Tokiboshi-windows.zip" "$RUNNER_TEMP/assets/SHA256SUMS.txt" --target "$RELEASE_TARGET" --title 'Tokiboshi v0.1.0' --notes-file .github/release-notes/v0.1.0.md --draft
          gh release view v0.1.0 --json isDraft,assets > "$RUNNER_TEMP/staged.json"
          jq -e '.isDraft == true and (.assets | length) == 3' "$RUNNER_TEMP/staged.json"
          gh release download v0.1.0 --dir "$RUNNER_TEMP/roundtrip"
          cd "$RUNNER_TEMP/roundtrip"
          cmp SHA256SUMS.txt "$RUNNER_TEMP/assets/SHA256SUMS.txt"
          sha256sum --check SHA256SUMS.txt
      - name: Publish verified Windows release
        run: gh release edit v0.1.0 --draft=false --latest
      - name: Verify public download links, latest and tag
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/public-downloads" "$RUNNER_TEMP/publication-proof"
          cd "$RUNNER_TEMP/public-downloads"
          for name in Tokiboshi-Setup-0.1.0.exe Tokiboshi-windows.zip SHA256SUMS.txt; do
            curl --fail --location --retry 3 --retry-delay 3 --output "$name" "https://github.com/$GH_REPO/releases/download/v0.1.0/$name"
          done
          cmp SHA256SUMS.txt "$RUNNER_TEMP/assets/SHA256SUMS.txt"
          sha256sum --check SHA256SUMS.txt
          gh api "repos/$GH_REPO/releases/latest" > "$RUNNER_TEMP/publication-proof/release.json"
          jq -e '.tag_name == "v0.1.0" and .name == "Tokiboshi v0.1.0" and .draft == false and .prerelease == false and (.assets | length) == 3' "$RUNNER_TEMP/publication-proof/release.json"
          gh api "repos/$GH_REPO/git/ref/tags/v0.1.0" > "$RUNNER_TEMP/publication-proof/tag.json"
          jq -e --arg sha "$RELEASE_TARGET" '.object.type == "commit" and .object.sha == $sha' "$RUNNER_TEMP/publication-proof/tag.json"
          cp SHA256SUMS.txt "$RUNNER_TEMP/publication-proof/SHA256SUMS.txt"
          cp "$RUNNER_TEMP/build.json" "$RUNNER_TEMP/publication-proof/build.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Tokiboshi-v010-publication-proof
          path: ${{ runner.temp }}/publication-proof
