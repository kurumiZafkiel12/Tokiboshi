name: Publish verified v0.0.1
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify build and download artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh run view 43696545506 --json conclusion,headSha > "$RUNNER_TEMP/build.json"
          jq -e '.conclusion == "success" and .headSha == "5d273e304bae45af16a1cd9bd9fe60c2040ddf81"' "$RUNNER_TEMP/build.json"
          gh run download 43696545506 --name Tokiboshi-windows --dir "$RUNNER_TEMP/assets"
          cd "$RUNNER_TEMP/assets"
          echo 'f9e5e248bcc4793be0f47cdaf6092aff5493137b7b1240bb59571e4d41d069cf  Tokiboshi-Setup-0.0.1.exe' > SHA256SUMS.txt
          echo 'e8290092c4d3bc4fdef2f115efe42711170c2b91c9f112f54b18ce86b047f373  Tokiboshi-windows.zip' >> SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Publish installer and portable package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create v0.0.1 "$RUNNER_TEMP/assets/Tokiboshi-Setup-0.0.1.exe" "$RUNNER_TEMP/assets/Tokiboshi-windows.zip" "$RUNNER_TEMP/assets/SHA256SUMS.txt" --target 5d273e304bae45af16a1cd9bd9fe60c2040ddf81 --title 'Tokiboshi v0.0.1' --notes-file .github/release-notes/v0.0.1.md --latest
