name: Publish beta v0.1.2 build 3 Windows (prerelease, latest stays v0.1.1)
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: publish-v012-beta3
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TARGET: 9a9c009edd9fdd8ce9ed36b20990e0cb11740d7e
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify candidate build and download pinned assets
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(gh api repos/$GH_REPO/branches/fix/v011-link-rules --jq .commit.sha)
          test "$SHA" = "$RELEASE_TARGET" || { echo "branch moved: $SHA"; exit 1; }
          gh run view 44922772568 --json conclusion,headSha,workflowName > "$RUNNER_TEMP/build.json"
          jq -e --arg sha "$RELEASE_TARGET" '.conclusion == "success" and .headSha == $sha and .workflowName == "windows"' "$RUNNER_TEMP/build.json"
          gh run download 44922772568 --name Tokiboshi-windows --dir "$RUNNER_TEMP/assets"
          ls "$RUNNER_TEMP/assets"
      - name: Stage draft release with generated checksums
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/assets"
          SETUP=$(ls Tokiboshi-Setup-*.exe | head -1)
          sha256sum "$SETUP" Tokiboshi-windows.zip > SHA256SUMS.txt
          gh release create v0.1.2-beta.3 \
            "$SETUP" Tokiboshi-windows.zip SHA256SUMS.txt \
            --target "$RELEASE_TARGET" \
            --title 'Tokiboshi v0.1.2 Beta 3' \
            --notes-file "$GITHUB_WORKSPACE/.github/release-notes/v0.1.2-beta.3.md" \
            --prerelease --draft
      - name: Roundtrip verify uploaded bytes
        shell: bash
        run: |
          set -euo pipefail
          gh release view v0.1.2-beta.3 --json isDraft,isPrerelease,assets > "$RUNNER_TEMP/staged.json"
          jq -e '.isDraft == true and .isPrerelease == true and (.assets | length) == 3' "$RUNNER_TEMP/staged.json"
          gh release download v0.1.2-beta.3 --dir "$RUNNER_TEMP/roundtrip"
          cd "$RUNNER_TEMP/roundtrip"
          sha256sum --check SHA256SUMS.txt
      - name: Publish prerelease (latest stays v0.1.1)
        run: gh release edit v0.1.2-beta.3 --draft=false
      - name: Verify public links and that latest is still v0.1.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/public-downloads" "$RUNNER_TEMP/publication-proof"
          cd "$RUNNER_TEMP/public-downloads"
          for name in Tokiboshi-Setup-0.1.2.exe Tokiboshi-windows.zip SHA256SUMS.txt; do
            curl --fail --location --retry 3 --retry-delay 3 --output "$name" \
              "https://github.com/$GH_REPO/releases/download/v0.1.2-beta.3/$name"
          done
          sha256sum --check SHA256SUMS.txt
          gh api "repos/$GH_REPO/releases/latest" > "$RUNNER_TEMP/publication-proof/latest.json"
          jq -e '.tag_name == "v0.1.1" and .prerelease == false' "$RUNNER_TEMP/publication-proof/latest.json"
          gh api "repos/$GH_REPO/releases/tags/v0.1.2-beta.3" > "$RUNNER_TEMP/publication-proof/beta.json"
          jq -e '.prerelease == true and .draft == false and (.assets | length) == 3' "$RUNNER_TEMP/publication-proof/beta.json"
          gh api "repos/$GH_REPO/git/ref/tags/v0.1.2-beta.3" > "$RUNNER_TEMP/publication-proof/tag.json"
          jq -e --arg sha "$RELEASE_TARGET" '.object.sha == $sha' "$RUNNER_TEMP/publication-proof/tag.json"
          cp SHA256SUMS.txt "$RUNNER_TEMP/publication-proof/"
          cp "$RUNNER_TEMP/build.json" "$RUNNER_TEMP/publication-proof/"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Tokiboshi-v012-beta3-publication-proof
          path: ${{ runner.temp }}/publication-proof
