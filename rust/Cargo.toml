[package]
name = "tokiboshi_rust"
version = "0.0.1"
edition = "2021"
description = "Tokiboshi Rust middle layer: sing-box config, core process and status management between the Flutter UI and the sing-box core."
license = "MIT OR Apache-2.0"

[lib]
name = "tokiboshi_rust"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
