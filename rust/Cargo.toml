[package]
name = "rust_lib_tokiboshi"
version = "0.1.0"
edition = "2021"
description = "Tokiboshi Rust middle layer: sing-box config, link parsing and core process management between the Flutter UI and the sing-box core."
license = "MIT OR Apache-2.0"

[lib]
name = "rust_lib_tokiboshi"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.11.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
base64 = "0.22"
ureq = "2"
zip = "2"
flate2 = "1"
tar = "0.4"
sha2 = "0.10"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[profile.release]
lto = true
